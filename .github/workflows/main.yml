name: CI

on: push 

jobs:
  test:
    strategy:
      matrix:
        target: [test-clj, test-cljs]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup CI Environment
        uses: yetanalytics/action-setup-env@v2
        with:
          java-version: '17'

      - name: Run Tests
        run: make ${{ matrix.target }}
